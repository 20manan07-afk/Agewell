<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGEWELL — Care for parents, even when you can't be there.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#122C4A;
  --ink2:#1B3E63;
  --sage:#4F8A73;
  --sage-d:#3C6C59;
  --sage-bg:#EEF6F1;
  --sand:#F6F1E7;
  --sand2:#EFE7D6;
  --gold:#C98A3B;
  --line:#D8CDB2;
  --muted:#5B6B7A;
  --muted2:#8A93A0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--sand);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Fraunces',serif;}
img{max-width:100%;display:block;}
button{cursor:pointer;font-family:inherit;}
input{font-family:inherit;}
input:focus, button:focus-visible{outline:2px solid var(--sage); outline-offset:1px;}
a{color:inherit;text-decoration:none;}
.wrap{max-width:1152px;margin:0 auto;padding:0 20px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:16px;padding:14px 26px;font-size:1.1rem;font-weight:600;
  border:none;transition:transform .12s, filter .12s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--sage);color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-secondary{background:transparent;color:var(--ink);border:2px solid var(--ink);}
.btn-sm{padding:9px 18px;font-size:.95rem;border-radius:12px;}
.btn-full{width:100%;}
.btn:disabled{opacity:.4;pointer-events:none;}

/* ---------- Nav ---------- */
header.site-nav{
  position:sticky;top:0;z-index:40;background:rgba(246,241,231,.92);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;}
.logo-img{height:34px;display:block;object-fit:contain;}
.logo-chip{display:inline-flex;align-items:center;border-radius:8px;}
.logo-chip.dark{background:var(--sand);padding:6px 10px;}
.nav-links{display:none;align-items:center;gap:4px;}
.nav-links button{
  padding:9px 14px;border-radius:12px;font-size:.95rem;font-weight:500;
  background:transparent;color:var(--ink2);border:none;
}
.nav-links button.active{background:var(--sand2);color:var(--sage-d);}
.nav-actions{display:none;align-items:center;gap:8px;}
.nav-login{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--ink2);font-weight:500;padding:9px 14px;}
.nav-burger{display:inline-flex;background:none;border:none;padding:6px;}
.mobile-menu{display:none;flex-direction:column;gap:2px;padding:8px 20px 18px;background:var(--sand);}
.mobile-menu.open{display:flex;}
.mobile-menu button{text-align:left;padding:12px;border-radius:12px;font-size:1rem;font-weight:500;background:transparent;border:none;color:var(--ink2);}
@media(min-width:1024px){
  .nav-links{display:flex;}
  .nav-actions{display:flex;}
  .nav-burger{display:none;}
}

/* ---------- Hero ---------- */
.hero{padding:56px 20px 64px;display:grid;gap:48px;}
.pill{
  display:inline-flex;align-items:center;padding:6px 14px;border-radius:999px;
  font-size:.9rem;font-weight:500;border:1px solid var(--line);background:#FBF8F1;color:var(--ink2);
}
h1.hero-title{font-size:2.6rem;line-height:1.05;margin:20px 0 0;}
h1.hero-title .accent{color:var(--sage);}
.hero-sub{font-size:1.15rem;color:var(--ink2);max-width:520px;margin-top:24px;}
.hero-ctas{display:flex;gap:16px;flex-wrap:wrap;margin-top:32px;}
.hero-stats{display:flex;gap:32px;flex-wrap:wrap;margin-top:40px;}
.hero-stat .num{font-family:'Fraunces',serif;font-size:1.8rem;}
.hero-stat .lbl{font-size:.85rem;color:var(--muted);}
.hero-img-wrap{position:relative;}
.hero-img-frame{border-radius:2rem;padding:6px;background:linear-gradient(160deg, var(--sage), var(--gold));}
.hero-img-inner{border-radius:1.7rem;overflow:hidden;background:var(--sand);}
.hero-img-inner img{width:100%;height:420px;object-fit:cover;}
.hero-badge{
  position:absolute;bottom:-24px;left:-12px;background:#fff;border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.12);padding:16px;display:flex;align-items:center;gap:12px;
  border:1px solid var(--line);
}
.hero-badge .ic{width:44px;height:44px;border-radius:999px;background:var(--sand2);display:flex;align-items:center;justify-content:center;}
.hero-badge .t1{font-weight:600;font-size:.9rem;}
.hero-badge .t2{font-size:.78rem;color:var(--muted);}
@media(min-width:1024px){
  .hero{grid-template-columns:1fr 1fr;align-items:center;padding:80px 20px 90px;}
  h1.hero-title{font-size:3.7rem;}
}

/* ---------- Thread section ---------- */
.thread-section{padding:64px 20px;background:var(--sand2);}
.thread-section h2{font-size:1.9rem;margin-bottom:8px;}
.thread-section p.lead{color:var(--ink2);max-width:520px;margin-bottom:40px;}
.thread-grid{display:grid;gap:32px;position:relative;}
.thread-line{display:none;}
.thread-item .dot{
  width:56px;height:56px;border-radius:999px;background:var(--sage);
  display:flex;align-items:center;justify-content:center;border:4px solid var(--sand2);
}
.thread-item .dot svg{width:22px;height:22px;stroke:#fff;}
.thread-item .t{font-weight:600;font-size:1.1rem;margin-top:14px;}
.thread-item .d{font-size:.9rem;color:var(--muted);margin-top:4px;}
@media(min-width:768px){
  .thread-grid{grid-template-columns:repeat(4,1fr);}
  .thread-line{display:block;position:absolute;left:0;right:0;top:28px;height:2px;background:var(--line);}
}

/* ---------- Problem ---------- */
.problem{padding:64px 20px;display:grid;gap:40px;}
.problem h2{font-size:1.9rem;margin-bottom:16px;}
.problem-text p{font-size:1.1rem;color:var(--ink2);}
.problem-cards{display:grid;gap:16px;}
.p-card{border-radius:16px;padding:20px;border:1px solid var(--line);background:#FBF8F1;}
.p-card .t{font-weight:600;margin-bottom:4px;}
.p-card .d{font-size:.9rem;color:var(--muted);}
@media(min-width:768px){
  .problem{grid-template-columns:1fr 1fr;align-items:start;}
  .problem-cards{grid-template-columns:repeat(3,1fr);}
}
@media(min-width:1024px){.problem{padding:80px 20px;}}

/* ---------- Services dark band ---------- */
.svc-band{padding:64px 20px;background:var(--ink);color:var(--sand);}
.svc-band .head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:32px;}
.svc-band h2{font-size:1.9rem;}
.svc-band .viewall{background:none;border:none;color:#9FD6BE;font-weight:500;display:flex;align-items:center;gap:4px;}
.svc-grid{display:grid;gap:20px;}
.svc-card{border-radius:16px;padding:20px;border:1px solid #28496B;background:#173352;}
.svc-card svg{width:26px;height:26px;stroke:#9FD6BE;}
.svc-card .t{font-weight:600;font-size:1.1rem;margin-top:12px;}
.svc-card .d{font-size:.9rem;color:#B9C7D6;margin-top:4px;}
@media(min-width:640px){.svc-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.svc-grid{grid-template-columns:repeat(3,1fr);}}

/* ---------- CTA ---------- */
.cta-final{max-width:720px;margin:0 auto;padding:80px 20px;text-align:center;}
.cta-final h2{font-size:1.9rem;margin-bottom:12px;}
.cta-final p{font-size:1.15rem;color:var(--ink2);margin-bottom:28px;}

/* ---------- Generic page ---------- */
.page{max-width:1152px;margin:0 auto;padding:64px 20px;}
.page-narrow{max-width:900px;}
.page-xnarrow{max-width:640px;}
.page h1{font-size:2.4rem;margin-bottom:12px;}
.page p.lead{font-size:1.15rem;color:var(--ink2);max-width:640px;margin-bottom:40px;}

/* Divider */
.thread-divider{display:flex;align-items:center;gap:12px;margin:16px 0;}
.thread-divider .l{height:1px;flex:1;background:var(--line);}
.thread-divider .d{width:6px;height:6px;border-radius:999px;background:var(--sage);}

/* Services page cards */
.svc-page-grid{display:grid;gap:20px;}
.svc-page-card{border-radius:16px;padding:24px;border:1px solid var(--line);background:#FBF8F1;display:flex;flex-direction:column;}
.svc-page-card .ic-wrap{width:48px;height:48px;border-radius:12px;background:var(--sand2);display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.svc-page-card .ic-wrap svg{width:22px;height:22px;stroke:var(--sage-d);}
.svc-page-card .t{font-weight:600;font-size:1.1rem;}
.svc-page-card .d{font-size:.9rem;color:var(--muted);margin-top:6px;flex:1;}
.svc-page-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:20px;}
.svc-page-card .price{font-size:.9rem;font-weight:500;color:var(--sage-d);}
@media(min-width:640px){.svc-page-grid{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.svc-page-grid{grid-template-columns:repeat(3,1fr);}}

.plans-grid{display:grid;gap:20px;margin-top:40px;font-size:.9rem;}
.plan-box{border-radius:12px;padding:16px;border:1px solid var(--line);}
.plan-box .t{font-weight:600;}
.plan-box .d{color:var(--muted);}
@media(min-width:768px){.plans-grid{grid-template-columns:repeat(3,1fr);}}

/* How it works */
.steps-list{display:flex;flex-direction:column;}
.step-row{display:flex;gap:20px;align-items:flex-start;}
.step-num{
  width:44px;height:44px;border-radius:999px;background:var(--sage);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;flex-shrink:0;
}
.step-body{padding-bottom:24px;border-bottom:1px solid var(--line);flex:1;}
.step-body .t{font-weight:600;font-size:1.2rem;}
.step-body .d{color:var(--muted);margin-top:4px;}

/* About */
.contact-box{border-radius:16px;padding:24px;border:1px solid var(--line);background:#FBF8F1;margin-top:20px;}
.contact-box .t{font-weight:600;margin-bottom:6px;}

/* Forms */
.field{margin-bottom:16px;}
.field label{display:block;font-size:.9rem;font-weight:500;color:var(--ink2);margin-bottom:6px;}
.field input{width:100%;border-radius:12px;border:1px solid var(--line);padding:12px 16px;font-size:1rem;background:#fff;}
.success-box{border-radius:16px;padding:24px;border:1px solid var(--sage);background:var(--sage-bg);display:flex;align-items:center;gap:12px;}
.success-box svg{stroke:var(--sage-d);flex-shrink:0;}

/* Dashboard */
.dash-head{display:flex;align-items:center;gap:12px;margin-bottom:32px;}
.dash-head svg{width:40px;height:40px;stroke:var(--sage-d);}
.dash-head .t{font-size:1.5rem;font-family:'Fraunces',serif;}
.dash-head .s{font-size:.9rem;color:var(--muted);}
.dash-tiles{display:grid;gap:16px;margin-bottom:40px;}
.dash-tile{border-radius:16px;padding:20px;border:1px solid var(--line);background:#fff;text-align:left;}
.dash-tile svg{width:22px;height:22px;}
.dash-tile .t{font-weight:600;margin-top:8px;}
@media(min-width:640px){.dash-tiles{grid-template-columns:repeat(3,1fr);}}
.hist-head{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.hist-head svg{width:20px;height:20px;}
.hist-head .t{font-size:1.5rem;font-family:'Fraunces',serif;}
.hist-empty{border-radius:16px;padding:32px;border:1px solid var(--line);text-align:center;color:var(--muted);}
.hist-row{border-radius:16px;padding:20px;border:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
.hist-row .t{font-weight:600;}
.hist-row .s{font-size:.9rem;color:var(--muted);}
.hist-tag{font-size:.85rem;font-weight:600;padding:4px 12px;border-radius:999px;background:var(--sage-bg);color:var(--sage-d);}

/* Booking flow */
.back-btn{display:inline-flex;align-items:center;gap:4px;background:none;border:none;font-size:.9rem;font-weight:500;color:var(--ink2);margin-bottom:24px;}
.step-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:40px;}
.sh-item{display:flex;align-items:center;gap:8px;}
.sh-circle{width:32px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700;background:var(--sand2);color:var(--muted2);}
.sh-circle.done{background:var(--sage);color:#fff;}
.sh-label{font-size:.9rem;font-weight:500;color:var(--muted2);display:none;}
.sh-label.done{color:var(--ink);}
.sh-sep{height:1px;width:32px;background:var(--line);}
@media(min-width:640px){.sh-label{display:inline;}}

.b-select-grid{display:grid;gap:16px;}
.b-select-card{
  text-align:left;border-radius:16px;padding:20px;border:2px solid var(--line);background:#FBF8F1;width:100%;
}
.b-select-card.active{border-color:var(--sage);background:var(--sage-bg);}
.b-select-card svg{width:24px;height:24px;stroke:var(--sage-d);}
.b-select-card .t{font-weight:600;margin-top:12px;}
.b-select-card .d{font-size:.9rem;color:var(--muted);margin-top:4px;}
@media(min-width:640px){.b-select-grid.services{grid-template-columns:repeat(2,1fr);}}
@media(min-width:1024px){.b-select-grid.services{grid-template-columns:repeat(3,1fr);}}

.a-row{width:100%;text-align:left;border-radius:16px;padding:20px;border:2px solid var(--line);background:#FBF8F1;display:flex;gap:16px;align-items:center;margin-bottom:16px;}
.a-row.active{border-color:var(--sage);background:var(--sage-bg);}
.a-avatar{width:56px;height:56px;border-radius:999px;background:var(--sand2);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;flex-shrink:0;}
.a-body{flex:1;}
.a-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.a-name{font-weight:600;}
.a-rating{font-size:.9rem;color:var(--gold);display:flex;align-items:center;gap:4px;}
.a-spec{font-size:.9rem;color:var(--muted);margin-top:4px;}
.a-meta{font-size:.78rem;color:var(--muted2);margin-top:4px;display:flex;gap:12px;flex-wrap:wrap;}
.a-meta span{display:flex;align-items:center;gap:4px;}
.a-check{stroke:var(--sage);flex-shrink:0;}

.sched-grid{display:grid;gap:20px;margin-bottom:24px;}
@media(min-width:640px){.sched-grid{grid-template-columns:1fr 1fr;}}
.dur-grid{display:grid;gap:12px;margin-bottom:24px;}
@media(min-width:640px){.dur-grid{grid-template-columns:1fr 1fr;}}
.dur-card{text-align:left;border-radius:12px;padding:16px;border:2px solid var(--line);background:#FBF8F1;}
.dur-card.active{border-color:var(--sage);background:var(--sage-bg);}
.dur-card .t{font-weight:600;}
.dur-card .d{font-size:.78rem;color:var(--muted2);margin-top:2px;}
.tier-row{display:flex;gap:12px;}
.tier-btn{padding:9px 16px;border-radius:12px;border:2px solid var(--line);font-size:.9rem;font-weight:500;color:var(--ink2);background:#fff;}
.tier-btn.active{border-color:var(--sage);color:var(--sage-d);}

.summary-box{border-radius:16px;border:1px solid var(--line);padding:24px;background:#FBF8F1;}
.summary-row{display:flex;justify-content:space-between;font-size:.95rem;padding:4px 0;}
.summary-row .k{color:var(--muted);}
.summary-row .v{font-weight:500;}
.summary-total{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;padding-top:12px;border-top:1px solid var(--line);align-items:center;}

.flow-nav{display:flex;justify-content:space-between;margin-top:40px;gap:16px;}

.confirmed-wrap{max-width:520px;margin:0 auto;padding:96px 20px;text-align:center;}
.confirmed-icon{width:64px;height:64px;border-radius:999px;background:var(--sage-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 24px;}
.confirmed-icon svg{width:32px;height:32px;stroke:var(--sage-d);}
.confirmed-wrap h1{font-size:1.9rem;margin-bottom:12px;}
.confirmed-wrap p{color:var(--muted);margin-bottom:32px;}
.confirmed-ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}

/* Footer */
footer{background:var(--ink);color:#B9C7D6;padding-top:56px;padding-bottom:32px;}
.foot-grid{display:grid;gap:32px;margin-bottom:40px;}
.foot-col .tagline{font-size:.9rem;margin-top:12px;max-width:280px;}
.foot-col .head{font-weight:600;font-size:.9rem;margin-bottom:12px;color:var(--sand);}
.foot-links{display:flex;flex-direction:column;gap:8px;font-size:.9rem;}
.foot-links button{text-align:left;background:none;border:none;color:inherit;}
.foot-contact{font-size:.9rem;display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.foot-bottom{font-size:.78rem;padding-top:24px;border-top:1px solid #28496B;}
@media(min-width:640px){.foot-grid{grid-template-columns:repeat(3,1fr);}}

.hidden{display:none !important;}
</style>
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <button id="nav-logo-btn" aria-label="AgeWell home"></button>
    <nav class="nav-links" id="nav-links"></nav>
    <div class="nav-actions">
      <button class="nav-login" data-go="login">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Login
      </button>
      <button class="btn btn-primary btn-sm" data-go="book">Book Now
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
    <button class="nav-burger" id="burger-btn" aria-label="Menu">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#122C4A" stroke-width="2"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
  </div>
  <div class="mobile-menu" id="mobile-menu"></div>
</header>

<main id="app-root"></main>

<footer>
  <div class="wrap">
    <div class="foot-grid">
      <div class="foot-col">
        <div id="footer-logo"></div>
        <p class="tagline">Care for parents, even when you can't be there.</p>
      </div>
      <div class="foot-col">
        <div class="head">Navigate</div>
        <div class="foot-links">
          <button data-go="services">Services</button>
          <button data-go="how">How It Works</button>
          <button data-go="about">About</button>
          <button data-go="assistant">Become an Assistant</button>

      </div>
      <div class="foot-col">
        <div class="head">Contact</div>

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          +91 98xxxxxx01

        <div class="foot-contact">agewell0001@gmail.com</div>
      </div>
    </div>
    <div class="foot-bottom">© 2025 AgeWell · Blue Orbit, IIT (ISM) Dhanbad</div>
  </div>
</footer>

<script>
/* =========================================================

function tplBooking(){
  const f = state.flow;
  const price = f.duration ? (f.cityTier==="tier1"?f.duration.tier1:f.duration.tier2) : 0;
  const fee = Math.round(price*0.08);
  const total = price+fee;
  let body = "";

  if(f.step===0){
    body = `
      <h2 style="font-size:1.25rem;font-weight:600;margin-bottom:16px;">What does your parent need today?</h2>
      <div class="b-select-grid services">
        ${SERVICES.map(s=>`
          <button class="b-select-card ${f.service?.id===s.id?'active':''}" data-service="${s.id}">
            ${ICONS[s.icon]}
            <div class="t">${s.name}</div>
            <div class="d">${s.desc}</div>
          </button>
        `).join("")}
      </div>
    `;
  } else if(f.step===1){
    body = `
      <h2 style="font-size:1.25rem;font-weight:600;margin-bottom:16px;">Choose a verified assistant</h2>
      ${ASSISTANTS.map(a=>`
        <button class="a-row ${f.assistant?.id===a.id?'active':''}" data-assistant="${a.id}">
          <div class="a-avatar">${initials(a.name)}</div>
          <div class="a-body">
            <div class="a-name-row">
              <span class="a-name">${a.name}</span>
              <span class="a-rating">${ICONS.star.replace('<svg','<svg width="14" height="14"')} ${a.rating} (${a.reviews})</span>
            </div>
            <div class="a-spec">${a.spec}</div>
            <div class="a-meta"><span>${a.exp} experience</span><span>${a.langs}</span><span>${ICONS.mappin.replace('<svg','<svg width="12" height="12"')}${a.km}</span></div>
          </div>
          ${f.assistant?.id===a.id?ICONS.check.replace('<svg','<svg width="20" height="20" class="a-check"'):''}
        </button>
      `).join("")}
    `;
  } else if(f.step===2){
    body = `
      <h2 style="font-size:1.25rem;font-weight:600;margin-bottom:16px;">Schedule the visit</h2>
      <div class="sched-grid">
        <div class="field" style="margin-bottom:0;"><label>Date</label><input type="date" id="in-date" value="${f.date}"/></div>
        <div class="field" style="margin-bottom:0;"><label>Time</label><input type="time" id="in-time" value="${f.time}"/></div>
      </div>
      <div class="field"><label>Location</label><input id="in-location" placeholder="e.g. Patliputra Colony, Patna" value="${f.location}"/></div>
      <label style="display:block;font-size:.9rem;font-weight:500;color:var(--ink2);margin-bottom:8px;">Duration</label>
      <div class="dur-grid">
        ${DURATIONS.map(d=>`
          <button class="dur-card ${f.duration?.id===d.id?'active':''}" data-duration="${d.id}">
            <div class="t">${d.label}</div><div class="d">${d.use}</div>
          </button>
        `).join("")}
      </div>
      <label style="display:block;font-size:.9rem;font-weight:500;color:var(--ink2);margin-bottom:8px;">City tier (affects pricing)</label>
      <div class="tier-row">
        <button class="tier-btn ${f.cityTier==='tier1'?'active':''}" data-tier="tier1">Tier 1 city</button>
        <button class="tier-btn ${f.cityTier==='tier2'?'active':''}" data-tier="tier2">Tier 2 city</button>
      </div>
    `;
  } else if(f.step===3){
    body = `
      <h2 style="font-size:1.25rem;font-weight:600;margin-bottom:16px;">Booking summary</h2>
      <div class="summary-box">
        ${[
          ["Service", f.service?.name||"—"],
          ["Assistant", f.assistant?.name||"—"],
          ["Date", f.date||"—"],
          ["Time", f.time||"—"],
          ["Duration", f.duration?.label||"—"],
          ["Location", f.location||"—"],
        ].map(([k,v])=>`<div class="summary-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")}
        <div class="thread-divider"><div class="l"></div><div class="d"></div><div class="l"></div></div>
        <div class="summary-row"><span class="k">Price</span><span class="v">₹${price}</span></div>
        <div class="summary-row"><span class="k">Platform / service fee</span><span class="v">₹${fee}</span></div>
        <div class="summary-total"><span>Total amount</span><span>₹${total}</span></div>
      </div>
    `;
  }

  const canNext = [!!f.service, !!f.assistant, !!(f.date && f.time && f.location), true][f.step];

  return `
  <div class="page page-narrow">
    <button class="back-btn" id="flow-back">${ICONS.chevronL.replace('<svg','<svg width="18" height="18"')} Back</button>

    <div class="flow-nav">
      <button class="btn btn-secondary" id="flow-back2">Back</button>
      ${f.step<3
        ? `<button class="btn btn-primary" id="flow-next" ${canNext?'':'disabled'}>Continue ${ICONS.chevronR.replace('<svg','<svg width="20" height="20"')}</button>`
        : `<button class="btn btn-primary" id="flow-confirm">Confirm Booking ${ICONS.check.replace('<svg','<svg width="20" height="20"')}</button>`
      }
    </div>
  </div>
  `;
}

/* ---------------- Render dispatcher ---------------- */
function render(){
  renderNavLogo();
  renderNavLinks();
  document.getElementById("mobile-menu").classList.remove("open");

  const root = document.getElementById("app-root");
  const tpls = {
    home: tplHome, services: tplServices, how: tplHow, about: tplAbout,
    assistant: tplAssistant, login: tplLogin, dashboard: tplDashboard,
    book: tplBooking, confirmed: tplConfirmed,
  };
  root.innerHTML = (tpls[state.page] || tplHome)();
  attachHandlers();
}

/* ---------------- Event delegation ---------------- */
function attachHandlers(){
  document.querySelectorAll("[data-go]").forEach(el=>{
    el.addEventListener("click", ()=> go(el.getAttribute("data-go")));
  });

  // Assistant application form
  const af = document.getElementById("assistant-form");
  if(af){
    af.addEventListener("submit", e=>{
      e.preventDefault();
      document.getElementById("assistant-form-area").innerHTML = `
        <div class="success-box">
          ${ICONS.check.replace('<svg','<svg width="24" height="24"')}
          <div>Thanks for applying — our team will reach out within 48 hours.</div>
        </div>`;
    });
  }

  // Login form
  const lf = document.getElementById("login-form");
  if(lf){ lf.addEventListener("submit", e=>{ e.preventDefault(); go("dashboard"); }); }
  const guestBtn = document.getElementById("guest-book-btn");
  if(guestBtn){ guestBtn.addEventListener("click", ()=>go("book")); }

  // Booking flow
  if(state.page==="book"){
    const f = state.flow;

    document.getElementById("flow-back").onclick = ()=> flowBack();
    document.getElementById("flow-back2").onclick = ()=> flowBack();

    document.querySelectorAll("[data-service]").forEach(el=>{
      el.addEventListener("click", ()=>{
        f.service = SERVICES.find(s=>s.id===el.getAttribute("data-service"));
        render();
      });
    });
    document.querySelectorAll("[data-assistant]").forEach(el=>{
      el.addEventListener("click", ()=>{
        f.assistant = ASSISTANTS.find(a=>a.id===Number(el.getAttribute("data-assistant")));
        render();
      });
    });
    document.querySelectorAll("[data-duration]").forEach(el=>{
      el.addEventListener("click", ()=>{
        f.duration = DURATIONS.find(d=>d.id===el.getAttribute("data-duration"));
        render();
      });
    });
    document.querySelectorAll("[data-tier]").forEach(el=>{
      el.addEventListener("click", ()=>{
        f.cityTier = el.getAttribute("data-tier");
        render();
      });
    });
    const dIn = document.getElementById("in-date");
    const tIn = document.getElementById("in-time");
    const lIn = document.getElementById("in-location");
    if(dIn) dIn.addEventListener("input", e=>{ f.date = e.target.value; syncNextBtn(); });
    if(tIn) tIn.addEventListener("input", e=>{ f.time = e.target.value; syncNextBtn(); });
    if(lIn) lIn.addEventListener("input", e=>{ f.location = e.target.value; syncNextBtn(); });

    const nextBtn = document.getElementById("flow-next");
    if(nextBtn){ nextBtn.addEventListener("click", ()=>{ f.step = Math.min(3, f.step+1); render(); }); }
    const confirmBtn = document.getElementById("flow-confirm");
    if(confirmBtn){ confirmBtn.addEventListener("click", confirmBooking); }
  }
}

function syncNextBtn(){
  const f = state.flow;
  const nextBtn = document.getElementById("flow-next");
  if(nextBtn){
    const ok = !!(f.date && f.time && f.location);
    nextBtn.disabled = !ok;
  }
}

function flowBack(){
  const f = state.flow;
  if(f.step===0){ go("home"); }
  else { f.step = Math.max(0, f.step-1); render(); }
}

function confirmBooking(){
  const f = state.flow;
  const price = f.duration ? (f.cityTier==="tier1"?f.duration.tier1:f.duration.tier2) : 0;
  const fee = Math.round(price*0.08);
  const booking = { ...f, price, fee, total: price+fee };
  state.bookings.unshift(booking);
  state.lastBooking = booking;
  // reset flow for next time
  state.flow = { step:0, service:null, assistant:null, duration:DURATIONS[1], cityTier:"tier2", date:"", time:"", location:"" };
  go("confirmed");
}

/* ---------------- Init ---------------- */
render();
</script>
</body>
</html>
